version: '3.8'

services:
  ip-location-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ip-location-api
    ports:
      - "8000:8000"
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - BAIDU_DEFAULT_AK=your_actual_baidu_ak_here
      - AMAP_DEFAULT_KEY=your_actual_amap_key_here
      - ENABLE_BAIDU_MAP_IP=true
      - ENABLE_AMAP_IP=true
      - ENABLE_BAIDU_OPENDATA=true
      - ENABLE_PCONLINE=true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ip-api-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  ip-api-network:
    driver: bridge